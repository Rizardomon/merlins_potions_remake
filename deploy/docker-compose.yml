# Stack da aplicação (web + server).
#
#   docker compose --env-file deploy/app.env -f deploy/docker-compose.yml up -d --build
#
# O Postgres de produção é EXTERNO: aponte a DATABASE_URL para o banco do ambiente. Para
# dev/CI há um serviço local opcional sob o profile `dev-db` (não sobe no deploy padrão):
#
#   docker compose -f deploy/docker-compose.yml --profile dev-db up -d postgres
#
# `BIND_ADDR` controla onde as portas são publicadas. Use `127.0.0.1` quando houver um proxy
# reverso na MESMA máquina; um IP da LAN só quando o proxy estiver em outra — e nesse caso o
# firewall precisa liberar as portas APENAS para o IP do proxy, senão qualquer um na rede
# alcança os containers direto e contorna o proxy.

# Nome do projeto compose: sem isso ele viria da pasta (`deploy`), e os containers sairiam
# como `deploy-server-1` / `deploy-web-1`.
name: app

services:
  # Postgres local para dev/CI. Sobe só com `--profile dev-db`; em produção use um banco
  # externo e aponte DATABASE_URL para ele.
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    profiles: ["dev-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations versionadas (Drizzle) e SAI. Usa a mesma imagem do server, mas roda
  # o runner. O `server` só sobe após este sair com sucesso.
  #
  # Descomente junto com a primeira migration versionada (ver docs/padroes/migrations.md).
  # migrate:
  #   build:
  #     context: ..
  #     dockerfile: apps/server/Dockerfile
  #   image: app-server:${TAG:-latest}
  #   container_name: app-migrate
  #   restart: "no"
  #   command: ["node", "dist/database/migrate.js"]
  #   environment:
  #     NODE_ENV: production
  #     DATABASE_URL: ${DATABASE_URL}

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: app-server:${TAG:-latest}
    container_name: app-api
    restart: unless-stopped
    # depends_on:
    #   migrate:
    #     condition: service_completed_successfully
    ports: ["${BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-3001}:3001"]
    environment:
      NODE_ENV: production
      API_PORT: 3001
      # Origem do web liberada no CORS.
      WEB_ORIGIN: ${WEB_ORIGIN}
      # Obrigatória: banco externo em produção (ou o serviço `postgres` no profile dev-db).
      DATABASE_URL: ${DATABASE_URL}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: app-web:${TAG:-latest}
    container_name: app-web
    restart: unless-stopped
    depends_on: [server]
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    environment:
      NODE_ENV: production
      # Rede interna do compose: o browser NUNCA fala com o server direto — só o BFF do Next.
      API_URL: http://server:3001/api

volumes:
  postgres-data:
